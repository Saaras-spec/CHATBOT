<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FactCheck AI - Enterprise Misinformation Detection</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080810;
    --surface: #11111a;
    --card: #161622;
    --border: #22223a;
    --border-light: #2e2e4a;
    
    --true: #00e5a0;
    --false: #ff4060;
    --partial: #ffb84d;
    --unverifiable: #9090e8;
    
    --risk-low: #00e5a0;
    --risk-medium: #ffb84d;
    --risk-high: #ff4060;
    
    --accent: #5b5bd6;
    --accent-hover: #7070e8;
    --accent-soft: rgba(91,91,214,0.15);
    
    --text: #eeeef5;
    --muted: #8b8baf;
    --hint: #4a4a6c;
    
    --font-heading: 'Bebas Neue', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(91,91,214,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(91,91,214,0.03) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }

  /* ── Layout ── */
  .app-container {
    display: flex;
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 1;
  }

  /* ── Sidebar (History) ── */
  .sidebar {
    width: 300px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease;
  }

  .sidebar-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sidebar-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .clear-history-btn {
    background: none; border: none; color: var(--hint);
    cursor: pointer; font-size: 12px; transition: color 0.2s;
  }
  .clear-history-btn:hover { color: var(--false); }

  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }
  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .history-item {
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    margin-bottom: 5px;
    border: 1px solid transparent;
  }
  .history-item:hover { background: var(--card); border-color: var(--border); }
  
  .history-claim {
    font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .history-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10px; font-family: var(--font-mono);
  }

  /* ── Main Area ── */
  .main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ── Header / Dashboard ── */
  .top-bar {
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(17, 17, 26, 0.8);
    backdrop-filter: blur(10px);
    z-index: 10;
  }

  .brand h1 {
    font-family: var(--font-heading);
    font-size: 32px;
    letter-spacing: 2px;
    background: linear-gradient(160deg, #fff 40%, #9090e8 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .brand p { font-size: 12px; color: var(--muted); }

  .dashboard-stats {
    display: flex;
    gap: 15px;
  }
  .stat-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 15px;
    display: flex; flex-direction: column; align-items: center;
    min-width: 80px;
  }
  .stat-val { font-family: var(--font-mono); font-size: 18px; font-weight: bold; }
  .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  
  .val-true { color: var(--true); }
  .val-false { color: var(--false); }
  .val-partial { color: var(--partial); }
  .val-unverifiable { color: var(--unverifiable); }

  .settings-toggle {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 8px 12px; border-radius: 6px;
    cursor: pointer; font-family: var(--font-mono); font-size: 11px;
    transition: all 0.2s;
  }
  .settings-toggle:hover { background: var(--border); }

  /* ── Chat Area ── */
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  /* ── Input Area ── */
  .input-area {
    padding: 20px 40px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }

  .input-wrapper {
    max-width: 800px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: flex-end;
    padding: 8px;
    transition: border-color 0.2s;
  }
  .input-wrapper:focus-within { border-color: var(--accent); }

  textarea {
    flex: 1;
    background: transparent; border: none; outline: none;
    color: var(--text); font-family: var(--font-body); font-size: 15px;
    resize: none; padding: 12px; max-height: 150px; min-height: 44px;
  }

  .send-btn {
    width: 44px; height: 44px;
    background: var(--accent); border: none; border-radius: 8px;
    color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Settings Panel ── */
  .settings-panel {
    position: absolute;
    top: 80px; right: 40px;
    width: 300px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    z-index: 100;
    display: none;
  }
  .settings-panel.active { display: block; }

  .setting-group { margin-bottom: 15px; }
  .setting-label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted); margin-bottom: 8px;
  }
  .setting-slider { width: 100%; cursor: pointer; }
  .setting-select {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 8px; border-radius: 6px; outline: none;
  }

  /* ── Message Styles & Verdict Cards ── */
  .msg-row { display: flex; width: 100%; max-width: 800px; margin: 0 auto; }
  .msg-row.user { justify-content: flex-end; }

  .user-bubble {
    background: var(--accent-soft); border: 1px solid rgba(91,91,214,0.3);
    padding: 12px 18px; border-radius: 18px 18px 4px 18px;
    font-size: 15px; max-width: 80%; line-height: 1.5;
  }

  .ai-bubble { width: 100%; }

  .verdict-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    animation: slideUp 0.4s ease-out;
  }
  
  @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

  .vc-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border);
  }

  .vc-verdict {
    font-family: var(--font-heading); font-size: 36px; letter-spacing: 2px; line-height: 1;
  }
  .vc-verdict.true { color: var(--true); }
  .vc-verdict.false { color: var(--false); }
  .vc-verdict.partial { color: var(--partial); font-size: 30px; }
  .vc-verdict.unverifiable { color: var(--unverifiable); font-size: 28px; }

  .vc-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    font-family: var(--font-mono); font-size: 10px; padding: 4px 8px;
    border-radius: 4px; text-transform: uppercase; border: 1px solid;
  }
  .tag.cat { border-color: var(--border-light); color: var(--muted); }
  .tag.risk-low { border-color: rgba(0,229,160,0.3); color: var(--risk-low); background: rgba(0,229,160,0.1); }
  .tag.risk-medium { border-color: rgba(255,184,77,0.3); color: var(--risk-medium); background: rgba(255,184,77,0.1); }
  .tag.risk-high { border-color: rgba(255,64,96,0.3); color: var(--risk-high); background: rgba(255,64,96,0.1); }

  .vc-scores { display: flex; gap: 20px; margin-bottom: 20px; }
  
  .score-main { flex: 1; }
  .score-label { font-size: 11px; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; font-family: var(--font-mono); }
  
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 1s ease-out; }
  
  .breakdown { flex: 2; display: flex; gap: 15px; }
  .bd-item { flex: 1; }
  .bd-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 5px;}
  .bd-fill { height: 100%; border-radius: 2px; }

  .vc-content h4 { font-size: 12px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; font-family: var(--font-mono); }
  .vc-content p { font-size: 15px; line-height: 1.6; color: #ddd; margin-bottom: 15px; }
  
  .vc-correction {
    background: rgba(255,184,77,0.1); border-left: 3px solid var(--partial);
    padding: 12px 15px; border-radius: 0 8px 8px 0; margin-top: 15px;
  }
  .vc-correction h4 { color: var(--partial); margin-bottom: 5px; }
  .vc-correction p { margin: 0; font-size: 14px; color: #eee; }

  .loading-spinner {
    display: flex; gap: 5px; padding: 20px;
  }
  .dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
  .dot:nth-child(1) { animation-delay: -0.32s; }
  .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  .error-msg {
    color: var(--false); background: rgba(255,64,96,0.1);
    padding: 15px; border-radius: 8px; border: 1px solid rgba(255,64,96,0.3);
  }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- Sidebar History -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Session History</span>
      <button class="clear-history-btn" onclick="clearHistory()">Clear</button>
    </div>
    <div class="history-list" id="historyList">
      <!-- History items injected here -->
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-area">
    
    <!-- Top Dashboard -->
    <div class="top-bar">
      <div class="brand">
        <h1>FACTCHECK AI</h1>
        <p>Enterprise Misinformation Detection System</p>
      </div>
      <div class="dashboard-stats">
        <div class="stat-box">
          <span class="stat-val" id="stat-total">0</span>
          <span class="stat-label">Checked</span>
        </div>
        <div class="stat-box">
          <span class="stat-val val-true" id="stat-true">0</span>
          <span class="stat-label">True</span>
        </div>
        <div class="stat-box">
          <span class="stat-val val-false" id="stat-false">0</span>
          <span class="stat-label">False</span>
        </div>
        <div class="stat-box">
          <span class="stat-val val-partial" id="stat-partial">0</span>
          <span class="stat-label">Partial</span>
        </div>
      </div>
      <button class="settings-toggle" onclick="toggleSettings()">⚙ Settings</button>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
      <div class="setting-group">
        <div class="setting-label"><span>Temperature</span> <span id="tempVal">0.0</span></div>
        <input type="range" class="setting-slider" id="tempSlider" min="0" max="1" step="0.1" value="0.0" oninput="document.getElementById('tempVal').innerText=this.value">
      </div>
      <div class="setting-group">
        <div class="setting-label"><span>Top-P</span> <span id="topPVal">1.0</span></div>
        <input type="range" class="setting-slider" id="topPSlider" min="0.1" max="1" step="0.1" value="1.0" oninput="document.getElementById('topPVal').innerText=this.value">
      </div>
      <div class="setting-group">
        <div class="setting-label"><span>Explanation Mode</span></div>
        <select class="setting-select" id="expMode">
          <option value="standard">Standard (Detailed)</option>
          <option value="simplified">Simplified (Easy)</option>
        </select>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-container" id="chatContainer">
      <div style="text-align:center; color:var(--muted); margin-top:50px;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:15px; opacity:0.5;">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
        <p>Enter a claim below to verify its factual accuracy.<br>The AI will analyze evidence, clarity, and reliability.</p>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="claimInput" placeholder="Analyze a claim (e.g., 'Vaccines alter human DNA')..." rows="1" onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); submitClaim(); }" oninput="this.style.height='auto'; this.style.height=(this.scrollHeight)+'px';"></textarea>
        <button class="send-btn" id="sendBtn" onclick="submitClaim()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>

  </div>
</div>

<script>
  // State
  let history = JSON.parse(localStorage.getItem('factcheck_history')) || [];
  
  // Init
  window.onload = () => {
    updateDashboard();
    renderHistory();
    if(history.length > 0) {
      document.getElementById('chatContainer').innerHTML = ''; // clear welcome msg
      // Render last few items
      history.slice(-3).forEach(item => {
        appendUserMessage(item.claim);
        appendVerdictCard(item.response);
      });
    }
  };

  function toggleSettings() {
    document.getElementById('settingsPanel').classList.toggle('active');
  }

  function saveToHistory(claim, response) {
    history.push({ claim, response, timestamp: new Date().toISOString() });
    localStorage.setItem('factcheck_history', JSON.stringify(history));
    updateDashboard();
    renderHistory();
  }

  function clearHistory() {
    if(confirm("Are you sure you want to clear your session history?")) {
      history = [];
      localStorage.removeItem('factcheck_history');
      updateDashboard();
      renderHistory();
      document.getElementById('chatContainer').innerHTML = '<div style="text-align:center; color:var(--muted); margin-top:50px;"><p>History cleared. Enter a new claim.</p></div>';
    }
  }

  function updateDashboard() {
    let t=0, f=0, p=0;
    history.forEach(i => {
      let v = (i.response.verdict || "").toUpperCase();
      if(v.includes("TRUE") && !v.includes("PARTIAL")) t++;
      else if(v.includes("FALSE")) f++;
      else if(v.includes("PARTIAL")) p++;
    });
    document.getElementById('stat-total').innerText = history.length;
    document.getElementById('stat-true').innerText = t;
    document.getElementById('stat-false').innerText = f;
    document.getElementById('stat-partial').innerText = p;
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    list.innerHTML = '';
    [...history].reverse().forEach(item => {
      let vColor = 'var(--muted)';
      let vText = item.response.verdict.toUpperCase();
      if(vText.includes('TRUE') && !vText.includes('PARTIAL')) vColor = 'var(--true)';
      else if(vText.includes('FALSE')) vColor = 'var(--false)';
      else if(vText.includes('PARTIAL')) vColor = 'var(--partial)';
      else if(vText.includes('NOT A CLAIM')) vColor = 'var(--unverifiable)';

      const div = document.createElement('div');
      div.className = 'history-item';
      div.innerHTML = `
        <div class="history-claim">${item.claim}</div>
        <div class="history-meta">
          <span style="color:${vColor}; font-weight:bold;">${vText}</span>
          <span>${new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
        </div>
      `;
      list.appendChild(div);
    });
  }

  function appendUserMessage(text) {
    const chat = document.getElementById('chatContainer');
    const welcome = chat.querySelector('div[style*="text-align:center"]');
    if(welcome) welcome.remove();

    chat.innerHTML += `
      <div class="msg-row user">
        <div class="user-bubble">${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
      </div>
    `;
    chat.scrollTop = chat.scrollHeight;
  }

  function appendLoading() {
    const chat = document.getElementById('chatContainer');
    const id = 'loading-' + Date.now();
    chat.innerHTML += `
      <div class="msg-row" id="${id}">
        <div class="loading-spinner">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>
    `;
    chat.scrollTop = chat.scrollHeight;
    return id;
  }

  function removeElement(id) {
    const el = document.getElementById(id);
    if(el) el.remove();
  }

  function appendError(msg) {
    const chat = document.getElementById('chatContainer');
    chat.innerHTML += `
      <div class="msg-row">
        <div class="error-msg">⚠ ${msg}</div>
      </div>
    `;
    chat.scrollTop = chat.scrollHeight;
  }

  function getRiskClass(risk) {
    const r = (risk || '').toLowerCase();
    if(r.includes('high')) return 'risk-high';
    if(r.includes('medium')) return 'risk-medium';
    return 'risk-low';
  }

  function getVerdictClass(v) {
    const r = (v || '').toUpperCase();
    if(r.includes('NOT A CLAIM') || r.includes('UNVERIFIABLE')) return 'unverifiable';
    if(r.includes('PARTIAL')) return 'partial';
    if(r.includes('TRUE')) return 'true';
    return 'false';
  }

  function appendVerdictCard(data) {
    const chat = document.getElementById('chatContainer');
    const vClass = getVerdictClass(data.verdict);
    const rClass = getRiskClass(data.riskLevel);
    const expMode = document.getElementById('expMode').value;
    const explanation = expMode === 'simplified' ? (data.simplifiedExplanation || data.explanation) : data.explanation;
    
    // Confidence breakdown parsing
    const bd = data.confidenceBreakdown || { evidence: 0, clarity: 0, reliability: 0 };
    
    // Fallback badge if triggered
    const fallbackBadge = data.isFallback ? `<span class="tag" style="border-color:var(--partial); color:var(--partial)">Offline Mode</span>` : '';

    let correctionHtml = '';
    if(data.correction && data.correction.trim().length > 0 && !vClass.includes('true')) {
      correctionHtml = `
        <div class="vc-correction">
          <h4>Fact Check Correction</h4>
          <p>${data.correction}</p>
        </div>
      `;
    }

    const card = document.createElement('div');
    card.className = 'msg-row';
    card.innerHTML = `
      <div class="verdict-card">
        <div class="vc-header">
          <div class="vc-verdict ${vClass}">${data.verdict.toUpperCase()}</div>
          <div class="vc-tags">
            ${fallbackBadge}
            <span class="tag cat">${data.category}</span>
            <span class="tag ${rClass}">${data.riskLevel}</span>
          </div>
        </div>
        
        <div class="vc-scores">
          <div class="score-main">
            <div class="score-label">Overall Confidence (${data.confidenceScore}%)</div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${data.confidenceScore}%"></div></div>
          </div>
          <div class="breakdown">
            <div class="bd-item">
              <div class="score-label" style="font-size:9px">Evidence</div>
              <div class="bd-bar"><div class="bd-fill" style="width:${bd.evidence}%; background:#5b5bd6"></div></div>
            </div>
            <div class="bd-item">
              <div class="score-label" style="font-size:9px">Clarity</div>
              <div class="bd-bar"><div class="bd-fill" style="width:${bd.clarity}%; background:#5b5bd6"></div></div>
            </div>
            <div class="bd-item">
              <div class="score-label" style="font-size:9px">Reliability</div>
              <div class="bd-bar"><div class="bd-fill" style="width:${bd.reliability}%; background:#5b5bd6"></div></div>
            </div>
          </div>
        </div>

        <div class="vc-content">
          <h4>Explanation (${expMode === 'simplified' ? 'Simplified' : 'Detailed'})</h4>
          <p>${explanation}</p>
        </div>
        
        ${correctionHtml}
      </div>
    `;
    
    chat.appendChild(card);
    chat.scrollTop = chat.scrollHeight;
  }

  async function submitClaim() {
    const input = document.getElementById('claimInput');
    const btn = document.getElementById('sendBtn');
    const claim = input.value.trim();
    
    if(!claim) return;
    
    // Get settings
    const temperature = parseFloat(document.getElementById('tempSlider').value);
    const topP = parseFloat(document.getElementById('topPSlider').value);

    // UI Updates
    input.value = '';
    input.style.height = '44px';
    btn.disabled = true;
    appendUserMessage(claim);
    const loadId = appendLoading();

    try {
      const res = await fetch('/api/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ claim, temperature, topP })
      });

      removeElement(loadId);

      if(!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'Failed to verify claim.');
      }

      const data = await res.json();
      appendVerdictCard(data);
      saveToHistory(claim, data);

    } catch(e) {
      removeElement(loadId);
      appendError(e.message);
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
